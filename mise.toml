# Build tooling for this repo. `mise install` provides both:
#   - bun:  package manager and script runner (`bun install`, `bun run build`)
#   - node: runtime for Playwright's test runner, which doesn't support Bun
[tools]
node = "24"
bun = "1.4"

# Runs after every `mise install` (even when the tools were already present),
# so one command also installs dependencies and the browser the tests use.
# Both steps are no-ops when already up to date.
[hooks]
postinstall = "bun install && bunx playwright install chromium"
